
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="utf-8" />
    <title>Interactive Graph</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        #mynetwork {
        width: 100%;
        height: 800px;
        border: 1px solid lightgray;
        }
    </style>
    </head>
    <body>
    <div id="mynetwork"></div>

    <script type="text/javascript">
    var nodes = new vis.DataSet([{'id': 'дом', 'label': 'дом'}, {'id': 'холм', 'label': 'холм'}, {'id': 'папа', 'label': 'папа'}]);
    var edges = new vis.DataSet([{'from': 'дом', 'to': 'холм', 'label': 'стоять'}, {'from': 'дом', 'to': 'папа', 'label': 'possessive'}]);

    var container = document.getElementById('mynetwork');
    var data = {
        nodes: nodes,
        edges: edges
    };

    var options = {
        interaction: {
        zoomView: true,
        dragView: true,
        dragNodes: true
        },
        edges: {
        arrows: 'to'
        },
        physics: {
        stabilization: true
        }
    };

    var network = new vis.Network(container, data, options);
    </script>

    </body>
    </html>
