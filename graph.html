
    <!DOCTYPE html>
    <html>
    <head>
    <meta charset="utf-8" />
    <title>Interactive Graph</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        #mynetwork {
        width: 100%;
        height: 800px;
        border: 1px solid lightgray;
        }
    </style>
    </head>
    <body>
    <div id="mynetwork"></div>

    <script type="text/javascript">
    var nodes = new vis.DataSet([{'id': 'numbers', 'label': 'numbers'}, {'id': 'case', 'label': 'case'}, {'id': 'heads', 'label': 'heads'}, {'id': 'tails', 'label': 'tails'}, {'id': 'penny', 'label': 'penny'}, {'id': 'few heads', 'label': 'few heads'}, {'id': 'diﬀerence', 'label': 'diﬀerence'}, {'id': 'respective numbers', 'label': 'respective numbers'}, {'id': 'proportion', 'label': 'proportion'}, {'id': 'other hand', 'label': 'other hand'}, {'id': 'most cases', 'label': 'most cases'}, {'id': 'unity', 'label': 'unity'}, {'id': 'game', 'label': 'game'}, {'id': 'other words', 'label': 'other words'}, {'id': 'chance', 'label': 'chance'}, {'id': 'spells', 'label': 'spells'}, {'id': 'runs', 'label': 'runs'}, {'id': 'luck', 'label': 'luck'}, {'id': 'their relative proportions', 'label': 'their relative proportions'}, {'id': 'whole amounts', 'label': 'whole amounts'}]);
    var edges = new vis.DataSet([{'from': 'case', 'to': 'penny', 'label': 'toss'}, {'from': 'diﬀerence', 'to': 'numbers', 'label': 'between'}, {'from': 'numbers', 'to': 'heads', 'label': 'of'}, {'from': 'numbers', 'to': 'tails', 'label': 'of'}, {'from': 'heads', 'to': 'tails', 'label': 'and'}, {'from': 'tails', 'to': 'heads', 'label': 'and'}, {'from': 'diﬀerence', 'to': 'respective numbers', 'label': 'between'}, {'from': 'proportion', 'to': 'other hand', 'label': 'throw on'}, {'from': 'proportion', 'to': 'most cases', 'label': 'throw in'}, {'from': 'proportion', 'to': 'heads', 'label': 'of'}, {'from': 'proportion', 'to': 'tails', 'label': 'to'}, {'from': 'proportion', 'to': 'case', 'label': 'in'}, {'from': 'game', 'to': 'other words', 'label': 'continue in'}, {'from': 'game', 'to': 'chance', 'label': 'of'}, {'from': 'spells', 'to': 'runs', 'label': 'and'}, {'from': 'runs', 'to': 'spells', 'label': 'and'}, {'from': 'runs', 'to': 'luck', 'label': 'of'}, {'from': 'their relative proportions', 'to': 'whole amounts', 'label': 'to'}]);

    var container = document.getElementById('mynetwork');
    var data = {
        nodes: nodes,
        edges: edges
    };

    var options = {
        interaction: {
        zoomView: true,
        dragView: true,
        dragNodes: true
        },
        edges: {
        arrows: 'to'
        },
        physics: {
        stabilization: true
        }
    };

    var network = new vis.Network(container, data, options);
    </script>

    </body>
    </html>
